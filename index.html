<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IntegralTech</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --primary:#2563eb;
  --primary2:#38bdf8;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.08);
  --success:#22c55e;
  --danger:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  font-family:Arial, sans-serif;

  background:
    radial-gradient(circle at top left,#1e3a8a 0%,transparent 30%),
    radial-gradient(circle at bottom right,#0ea5e9 0%,transparent 20%),
    var(--bg);

  color:var(--text);
}

.calc-wrap{
  width:100%;
  max-width:900px;

  background:rgba(17,24,39,.92);
  border:1px solid var(--border);

  border-radius:28px;
  padding:35px;

  backdrop-filter:blur(12px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.45);
}

.calc-title{
  font-size:34px;
  font-weight:800;
  margin-bottom:10px;

  background:linear-gradient(90deg,#60a5fa,#38bdf8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.calc-sub{
  color:var(--muted);
  line-height:1.7;
  margin-bottom:28px;
}

.section-header{
  margin-bottom:20px;

  padding:14px 18px;

  border-radius:16px;

  background:
    linear-gradient(
      90deg,
      rgba(37,99,235,.18),
      transparent
    );

  border:1px solid rgba(96,165,250,.15);

  color:#93c5fd;

  font-size:14px;
  font-weight:700;
}

.field-group{
  margin-bottom:18px;
}

.field-label{
  display:block;
  margin-bottom:8px;

  font-size:14px;
  font-weight:600;

  color:#dbeafe;
}

.field-label span{
  font-size:12px;
  font-weight:400;
  color:var(--muted);
}

input{
  width:100%;
  height:54px;

  border-radius:16px;
  border:1px solid var(--border);

  background:rgba(255,255,255,.03);

  color:white;

  padding:0 16px;

  font-size:15px;
  transition:.25s;
}

input:focus{
  outline:none;

  border-color:var(--primary);

  background:rgba(37,99,235,.08);

  box-shadow:
    0 0 0 4px rgba(37,99,235,.18);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.btn-calc{
  width:100%;
  height:58px;

  margin-top:14px;

  border:none;
  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  transition:.25s;

  box-shadow:
    0 10px 24px rgba(37,99,235,.35);
}

.btn-calc:hover{
  transform:translateY(-2px);

  box-shadow:
    0 14px 30px rgba(37,99,235,.5);
}

.results-box{
  margin-top:30px;

  border-radius:24px;

  overflow:hidden;

  border:1px solid var(--border);

  background:rgba(255,255,255,.03);

  display:none;

  animation:fade .45s ease;
}

.results-title{
  padding:18px;

  text-align:center;

  background:
    linear-gradient(
      90deg,
      #1d4ed8,
      #0ea5e9
    );

  font-size:18px;
  font-weight:700;
}

.results-body{
  padding:24px;
}

.result-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:16px 0;

  border-bottom:1px solid rgba(255,255,255,.06);

  gap:16px;
}

.result-row:last-child{
  border-bottom:none;
}

.result-label{
  color:#cbd5e1;
  font-size:14px;
}

.result-val{
  font-weight:700;
  font-size:15px;
}

.result-val.accent{
  color:#7dd3fc;
  font-size:18px;
}

.tag{
  display:inline-block;

  margin-left:8px;

  padding:4px 10px;

  border-radius:999px;

  background:rgba(34,197,94,.15);

  color:#86efac;

  font-size:11px;
}

.formula-note{
  margin-top:22px;

  padding:18px;

  border-radius:18px;

  background:rgba(255,255,255,.03);

  border:1px solid rgba(255,255,255,.05);

  color:#cbd5e1;

  line-height:1.8;
  font-size:13px;
}

.error-msg{
  margin-top:16px;

  padding:14px;

  border-radius:14px;

  background:rgba(239,68,68,.15);

  color:#fecaca;

  border:1px solid rgba(239,68,68,.2);

  display:none;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:700px){

  .grid2{
    grid-template-columns:1fr;
  }

  .result-row{
    flex-direction:column;
    align-items:flex-start;
  }

}
</style>
</head>

<body>

<div class="calc-wrap">

  <div class="calc-title">
    IntegralTech
  </div>

  <div class="calc-sub">
    Calculadora profesional para sólidos de revolución utilizando el método de anillos.
  </div>

  <div class="section-header">
    ⚙️ Funciones de entrada
  </div>

  <div class="field-group">
    <label class="field-label">
      Radio externo R(x)
      <span>Constante o función matemática</span>
    </label>

    <input
      type="text"
      id="f1"
      value="1.25"
      placeholder="Ej: 1.25 o sqrt(x)"
    >
  </div>

  <div class="field-group">
    <label class="field-label">
      Radio interno r(x)
      <span>Constante o función matemática</span>
    </label>

    <input
      type="text"
      id="f2"
      value="1.05"
      placeholder="Ej: 1.05 o 0.5*x"
    >
  </div>

  <div class="section-header" style="margin-top:26px;">
    📏 Límites de integración
  </div>

  <div class="grid2">

    <div class="field-group">
      <label class="field-label">
        Límite inferior a
      </label>

      <input type="number" id="a" value="0">
    </div>

    <div class="field-group">
      <label class="field-label">
        Límite superior b
      </label>

      <input type="number" id="b" value="40">
    </div>

  </div>

  <p id="err" class="error-msg"></p>

  <button class="btn-calc" onclick="calcular()">
    Calcular Integral
  </button>

  <div class="results-box" id="results-box">

    <div class="results-title">
      Resultado del cálculo
    </div>

    <div class="results-body">

      <div class="result-row">
        <span class="result-label">Función R(x)</span>
        <span class="result-val" id="r-f1"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Función r(x)</span>
        <span class="result-val" id="r-f2"></span>
      </div>

      <div class="result-row">
        <span class="result-label">Límites</span>
        <span class="result-val" id="r-lim"></span>
      </div>

      <div class="result-row">
        <span class="result-label">
          Área transversal
          <span class="tag">π(R²-r²)</span>
        </span>

        <span class="result-val accent" id="r-area"></span>
      </div>

      <div class="result-row">
        <span class="result-label">
          Volumen del material
          <span class="tag">π∫[R²-r²]dx</span>
        </span>

        <span class="result-val accent" id="r-vol"></span>
      </div>

      <div class="result-row">
        <span class="result-label">
          Área lateral externa
          <span class="tag">2πRL</span>
        </span>

        <span class="result-val" id="r-lat"></span>
      </div>

      <div class="formula-note" id="r-note"></div>

    </div>
  </div>

</div>

<script>
function parseFn(expr){

  expr = expr
    .replace(/sqrt/gi, 'Math.sqrt')
    .replace(/sin/gi, 'Math.sin')
    .replace(/cos/gi, 'Math.cos')
    .replace(/tan/gi, 'Math.tan')
    .replace(/pi/gi, 'Math.PI');

  return new Function(
    'x',
    `
      return ${expr};
    `
  );
}

function trapecio(fn, a, b, n){

  const h = (b - a) / n;

  let suma = fn(a) + fn(b);

  for(let i = 1; i < n; i++){

    const x = a + i * h;

    suma += 2 * fn(x);
  }

  return (h / 2) * suma;
}

function calcular(){

  const f1expr = document.getElementById('f1').value.trim();
  const f2expr = document.getElementById('f2').value.trim();

  const a = parseFloat(
    document.getElementById('a').value
  );

  const b = parseFloat(
    document.getElementById('b').value
  );

  const err = document.getElementById('err');

  err.style.display = 'none';

  let R, r;

  try{

    R = parseFn(f1expr);
    r = parseFn(f2expr);

  }catch(e){

    mostrarError(
      'Error al interpretar las funciones.'
    );

    return;
  }

  if(isNaN(a) || isNaN(b) || b <= a){

    mostrarError(
      'Los límites deben ser válidos y b debe ser mayor que a.'
    );

    return;
  }

  try{

    const n = 1000;

    const integrando = (x) => {

      return Math.PI * (
        Math.pow(R(x), 2) -
        Math.pow(r(x), 2)
      );
    };

    const volumen = trapecio(
      integrando,
      a,
      b,
      n
    );

    const xmedio = (a + b) / 2;

    const area = Math.PI * (
      Math.pow(R(xmedio), 2) -
      Math.pow(r(xmedio), 2)
    );

    const L = b - a;

    const areaLateral =
      2 *
      Math.PI *
      R(xmedio) *
      L;

    document.getElementById('r-f1').textContent = f1expr;
    document.getElementById('r-f2').textContent = f2expr;

    document.getElementById('r-lim').textContent =
      `Desde ${a} hasta ${b}`;

    document.getElementById('r-area').textContent =
      area.toFixed(4) + ' cm²';

    document.getElementById('r-vol').textContent =
      volumen.toFixed(4) + ' cm³';

    document.getElementById('r-lat').textContent =
      areaLateral.toFixed(4) + ' cm²';

    document.getElementById('r-note').innerHTML = `
      <strong>Método numérico:</strong> Trapecio compuesto<br>
      <strong>Subdivisiones:</strong> 1000<br>
      <strong>Fórmula:</strong> V = π ∫ [R(x)² − r(x)²] dx
    `;

    document.getElementById('results-box').style.display = 'block';

  }catch(e){

    mostrarError(
      'Error durante el cálculo: ' + e.message
    );
  }
}

function mostrarError(msg){

  const err = document.getElementById('err');

  err.textContent = msg;

  err.style.display = 'block';
}
</script>

</body>
</html>
